# 大肥鱼 · Windows 本机 Docker 套件（Docker Desktop + WSL2）
#
# 用法：powershell -ExecutionPolicy Bypass -File deploy-windows\start.ps1
# 约定：宿主路径都相对本文件；端口 / 时区 / QQ 号走同目录 .env。
# 依赖：镜像构建复用 ../deploy/Dockerfile，核心补丁复用 ../deploy/patches/（与 deploy-macos 相同做法）。
name: dafeiyu-windows

services:
  astrbot:
    build:
      context: ../deploy
      dockerfile: Dockerfile
    image: dafeiyu-astrbot:windows
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ASTRBOT_PORT:-6185}:6185"     # AstrBot 面板
      # 海豹 WebUI：海豹由骰子插件 astrbot_plugin_trpg_dice 在本容器内作为子进程托管
      # （TRPG 规格 §9.1），首次要在它的 WebUI 里添加指向 127.0.0.1:18779 的 OneBot 账号。
      # 骰子端点 18779 只在容器内部用，不映射。
      - "127.0.0.1:${SEALDICE_PORT:-3211}:3211"
      # OneBot 反向 WS（aiocqhttp）。容器内的 NapCat 走内部网络不需要它；
      # 在宿主机上跑的协议端（如 OpenQQ）连 ws://127.0.0.1:6199/ws。只绑本机。
      - "127.0.0.1:${ONEBOT_WS_PORT:-6199}:6199"
    volumes:
      # AstrBot 数据放在 Docker 数据卷里，不放 Windows 目录：SQLite 的 WAL/共享内存
      # 在 Docker Desktop 的 Windows 绑定挂载上不可靠。2026-11-16 实际出过事故：
      # data_v4.db 突然写不进去（disk I/O error），对话历史停更，她因此答非所问。
      # 数据卷由 migrate-data-volume.ps1 从旧的 .\data 迁移生成；external 保证卷不存在时
      # compose 直接报错，不会悄悄起一个空白的新实例。
      # TRPG 本地导入目录（modules_dir 默认 data/plugin_data/trpg/modules）与海豹程序
      # （sealdice_path 填 /AstrBot/data/sealdice/sealdice-core）也都在卷里。
      - astrbot-data:/AstrBot/data
      # 插件代码与插件配置仍放在宿主机，方便直接改：它们不是 SQLite，绑定挂载没问题。
      # 插件的数据库在 data/plugin_data，留在卷里。
      - ./data/plugins:/AstrBot/data/plugins
      - ./data/config:/AstrBot/data/config
      # 记忆插件（astrbot_plugin_memory_core）的记忆文件：Markdown + 独立 git 仓库，放宿主机方便
      # 直接查看、修改（插件会轮询发现手改，9p 挂载收不到文件事件）。它的 events.db / index.db
      # 是 SQLite，留在上面的数据卷里，不能挪到这里。不用记忆插件时这个目录一直是空的。
      - ${MEMORY_DIR:-./memory}:/AstrBot/data/plugin_data/astrbot_plugin_memory_core/memory
      # 核心补丁（AstrBot v4.29.0 源码修改版），只读 bind-mount，升级镜像不丢。
      # 只要基础聊天时注释掉下面四行。
      - ../deploy/patches/dashscope_tts.py:/AstrBot/astrbot/core/provider/sources/dashscope_tts.py:ro
      - ../deploy/patches/stage.py:/AstrBot/astrbot/core/pipeline/result_decorate/stage.py:ro
      - ../deploy/patches/respond_stage.py:/AstrBot/astrbot/core/pipeline/respond/stage.py:ro
      - ../deploy/patches/chat_layout.py:/AstrBot/astrbot/core/pipeline/chat_layout.py:ro
      # 拟人节奏：回复前按读消息/想/打字的时间等待，所有出站消息过全局限速
      - ../deploy/patches/human_pacing.py:/AstrBot/astrbot/core/utils/human_pacing.py:ro
      - ../deploy/patches/aiocqhttp_message_event.py:/AstrBot/astrbot/core/platform/sources/aiocqhttp/aiocqhttp_message_event.py:ro
      # 挂钩点（记忆系统规格 §16.1）：注册表 + 入站观察（唤醒判定前）。出站捕获 P-M1
      # 在上面的 aiocqhttp_message_event.py 里。没有插件注册回调时什么也不做。
      - ../deploy/patches/dafeiyu_hooks.py:/AstrBot/astrbot/core/dafeiyu_hooks.py:ro
      - ../deploy/patches/waking_check_stage.py:/AstrBot/astrbot/core/pipeline/waking_check/stage.py:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}

  napcat:
    # NapCat 已于 2026-11-12 删库停更，Docker Hub 镜像下架。本镜像来自备份
    # github.com/XingYunStar/NapCatQQ 的 v4.18.42 release（docker save 包），需先
    #   docker load -i napcat-docker-v4.18.42-amd64.tar
    # 已核验：NapCat.Shell.zip 与官方 tag 源码构建结果一致；QQ 层与腾讯官方
    # linuxqq_3.2.34-53644 deb 逐文件一致（2026-11-15）。
    # 2026-11-16 起协议端改用宿主机上的 OpenQQ。NapCat 登的是同一个小号，两边同时在线会互相顶号，
    # 所以放进 napcat profile：普通的 up/start 不会再带上它。确实要用 NapCat 时：
    #   docker compose --profile napcat up -d napcat
    profiles: ["napcat"]
    image: mlikiowa/napcat-docker:v4.18.42
    pull_policy: never
    restart: unless-stopped
    # 固定主机名：QQ 设备指纹会带上 hostname，重建容器后不容易被当成新设备
    hostname: dafeiyu-napcat
    ports:
      - "127.0.0.1:${NAPCAT_PORT:-6099}:6099"     # NapCat WebUI（扫码登录）
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 首次启动自动写好指向 AstrBot 的反向 WS（ws://astrbot:6199/ws），只在 onebot11.json 缺失时生效
      - MODE=astrbot
      # 快速登录：扫码成功过一次后，重启才免扫码
      - ACCOUNT=${QQ_ACCOUNT:-}
      - NAPCAT_QUICK_ACCOUNT=${QQ_ACCOUNT:-}
      # 可选：固定 WebUI token（只在 webui.json 不存在时写入）
      - WEBUI_TOKEN=${WEBUI_TOKEN:-}

volumes:
  astrbot-data:
    name: dafeiyu-astrbot-data
    external: true
